<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="../style.css">
        <link rel="icon" href="../assets/images/favicon.ico" type="image/x-icon">
        <title>CurtainsOS</title>
    </head>

    <body id="osbody">
        <script src="../js/curtainEffects.js"></script>
        <script src="../js/generalScript.js"></script>
        <script src="../js/windows.js"></script>
        <main>
            <div id="top-bar">
                <h1 class="color1 bold no-select">CurtainsOS</h1>
                <div class="top-bar-buttons">
                    <span class="color1 no-select" id="time-top-bar">12/10/2026 1:30:00pm</span>
                    <button class="nice-button" onclick="document.getElementById('curtainOverlay').classList.remove('is-open'); setTimeout(() => { window.location.href = '../index.html'; }, 1500);">Exit</button>
                </div>
            </div>
            <div class="desktop">
                <button class="nice-button" onclick="openWindow('window-1')">Welcome<img class="desktop-icon" src="../assets/images/welcome.png" alt="Welcome"></button>
                <button class="nice-button" onclick="openWindow('window-2')">Notes<img class="desktop-icon" src="../assets/images/notes.png" alt="Notes"></button>
            </div>

            <div id="window-1" class="window" style="visibility: visible !important;">
                <div class="window-header no-select">
                    <span class="window-title">CurtainsOS</span>
                    <button class="close-button"><img class="close-icon" src="../assets/images/close.svg" alt="Close"></button>
                </div>
                <div class="window-content">
                    <h1>Welcome to CurtainsOS!</h1>
                    <p>This is CurtainsOS! A pun on Windows, with lot's of cool features such as curtain animations and other easter eggs.</p>
                </div>
            </div>

            <div id="window-2" class="window">
                <div class="window-header no-select">
                    <span class="window-title">Notes</span>
                    <button class="close-button"><img class="close-icon" src="../assets/images/close.svg" alt="Close"></button>
                </div>
                <div class="window-content">
                    <textarea class="nice-textarea" placeholder="This is a simple notes window. You can add your own notes here."></textarea>
                </div>
            </div>
        </main>

        <div id="curtainOverlay" class="curtain-container">
            <div class="left-curtain"></div>
            <div class="right-curtain"></div>
        </div>
    </body>
</html>
